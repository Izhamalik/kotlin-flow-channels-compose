plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'com.example.flowschannels'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.example.flowschannels"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
        }
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.activity.compose
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons.core
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx

    // collectAsStateWithLifecycle() lives here - it is the reason this module exists.
    implementation libs.androidx.lifecycle.runtime.compose
    // viewModelScope
    implementation libs.androidx.lifecycle.viewmodel.ktx
    // viewModel() inside @Composable
    implementation libs.androidx.lifecycle.viewmodel.compose

    implementation libs.androidx.navigation.compose

    // Flow/Channel APIs plus Dispatchers.Main for Android.
    implementation libs.kotlinx.coroutines.android

    // Used only to show a real, compiling Retrofit interface in the "Flow + Retrofit" lesson.
    // The app itself runs against an offline fake implementation of that interface.
    implementation libs.retrofit

    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.turbine

    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.junit
    debugImplementation libs.androidx.compose.ui.test.manifest
    debugImplementation libs.androidx.compose.ui.tooling
}